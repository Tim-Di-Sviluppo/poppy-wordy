<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Poppy Wordy – Word Shooter</title>
  <meta name="description" content="Lancia bolle-lettera, forma parole italiane, fai esplodere la griglia!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f9f9f7;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1a1c1b;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Game container: fills viewport on mobile, constrained on desktop */
    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 540px; /* Tablet/Desktop limit */
      max-height: 960px;
      background: #f9f9f7;
      overflow: hidden;
      box-shadow: rgba(26, 28, 27, 0.08) 0px 24px 48px, rgba(26, 28, 27, 0.04) 0px 8px 16px;
      border: 1px solid #bec9bf;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (max-width: 600px) {
      #game-wrapper {
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    canvas {
      display: block;
      outline: none;
      border: none;
    }

    /* Word-found overlay toast */
    #word-toast {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: #ffffff;
      color: #086c42;
      font-family: 'Lexend', sans-serif;
      font-size: 24px;
      font-weight: 600;
      padding: 12px 32px;
      box-shadow: rgba(8, 108, 66, 0.15) 0px 12px 24px;
      border-radius: 9999px;
      /* pill */
      pointer-events: none;
      opacity: 0;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      z-index: 20;
      transition: opacity 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }

    #word-toast.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Game-over overlay */
    #game-over {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(249, 249, 247, 0.94);
      z-index: 30;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px;
      text-align: center;
    }

    #game-over.visible {
      display: flex;
    }

    #game-over h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 48px;
      font-weight: 800;
      color: #1a1c1b;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    #game-over p {
      font-size: 20px;
      font-weight: 500;
      color: #3f4941;
      margin-bottom: 24px;
    }

    #restart-btn,
    #menu-btn {
      padding: 16px 32px;
      border: none;
      border-radius: 9999px;
      /* pill */
      font-family: 'Lexend', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    #restart-btn {
      background: #086c42;
      box-shadow: rgba(8, 108, 66, 0.25) 0px 8px 16px;
    }

    #restart-btn:hover {
      transform: translateY(-2px);
      background: #005230;
      box-shadow: rgba(8, 108, 66, 0.35) 0px 12px 20px;
    }

    #menu-btn {
      background: #9e3f49;
      box-shadow: rgba(158, 63, 73, 0.25) 0px 8px 16px;
    }

    #menu-btn:hover {
      transform: translateY(-2px);
      background: #75202c;
      box-shadow: rgba(158, 63, 73, 0.35) 0px 12px 20px;
    }

    #restart-btn:active,
    #menu-btn:active {
      transform: translateY(0);
    }
  </style>
  <script type="module" crossorigin src="/poppy-wordy/assets/index-CvqA01nr.js"></script>
</head>

<body>
  <!-- Hidden elements to force font loading before Phaser starts -->
  <div style="font-family: 'Material Symbols Outlined'; position: absolute; opacity: 0; pointer-events: none;">
    videogame_asset equalizer settings play_circle emoji_events arrow_forward
  </div>
  <div id="game-wrapper">
    <div id="word-toast"></div>
    <div id="game-over">
      <h2>GAME OVER</h2>
      <p id="final-score">Punteggio: 0</p>
      <div style="display: flex; gap: 16px;">
        <button id="menu-btn">MENU</button>
        <button id="restart-btn">RIGIOCA</button>
      </div>
    </div>
  </div>
</body>

</html>
